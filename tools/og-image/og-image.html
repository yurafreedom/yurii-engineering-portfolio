<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:radial-gradient(900px 620px at 78% -140px,#2a215e88,transparent 66%),#090b0f;
    color:#f5f7fa;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.5;
    padding:64px 72px;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;
  }
  .glow{position:absolute;right:-80px;top:-120px;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(circle,#8a75ff33 0%,#3b79ff1a 34%,transparent 70%);filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:24px;letter-spacing:-.01em}
  .brand-mark{display:grid;place-items:center;width:52px;height:52px;border:1px solid #ffffff1d;
    border-radius:15px;background:linear-gradient(135deg,#7c5cff,#20c5d8);font-size:18px;font-weight:700}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:17px;letter-spacing:.12em;
    text-transform:uppercase;color:#b6bed0;margin-bottom:26px}
  .pulse{width:11px;height:11px;border-radius:50%;background:#1ed6b3;box-shadow:0 0 22px #1ed6b3}
  h1{font-size:72px;line-height:1.02;letter-spacing:-.045em;font-weight:800;max-width:1000px}
  h1 em{font-style:normal;color:#9e8bff}
  .stack{display:flex;flex-wrap:wrap;gap:11px}
  .stack span{padding:11px 16px;border-radius:10px;background:#151a22;border:1px solid #ffffff0d;
    color:#a9b2c2;font-size:17px;font-weight:500}
  .rule{height:1px;background:linear-gradient(90deg,#7c5cff88,#20c5d833,transparent);margin-bottom:30px}
</style></head>
<body>
  <div class="glow"></div>
  <div class="brand"><span class="brand-mark">YS</span><span>Yurii Sachenko</span></div>
  <div>
    <div class="eyebrow"><span class="pulse"></span>Python · AI · Integrations · Production Systems</div>
    <h1>I build the parts that have to <em>actually work.</em></h1>
  </div>
  <div>
    <div class="rule"></div>
    <div class="stack">
      <span>Python</span><span>FastAPI</span><span>PostgreSQL</span><span>Redis</span>
      <span>Celery</span><span>Docker</span><span>REST APIs</span><span>LLM / Vision</span>
    </div>
  </div>
</body></html>
